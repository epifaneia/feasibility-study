<!DOCTYPE html>
<!--
  PANEL DEL CONSULTOR (no lo ve el cliente). Se abre a mano después de la reunión:
  lista de leads con su estado, ver/copiar el prompt enviado al research, y abrir el
  PDF, el anexo, el research (md) y los avisos de QA. Servido por app.py en /panel.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Estudio de viabilidad de IA</title>
<style>
  :root{--brand:#2F5597;--brand-d:#1F3864;--ink:#262626;--muted:#595959;--faint:#8C8C8C;--line:#C9D3E0;--bg:#F3F5F8;
        --green:#185335;--green-bg:#E6F2E8;--orange:#C0602A;
        --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink);line-height:1.5}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px}
  .top .brand{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--brand);
              padding-right:16px;border-right:1px solid var(--line)}
  .top h1{font-size:18px;margin:0;color:var(--brand-d)}
  .top .sub{font-size:12.5px;color:var(--muted)}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px;display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--brand);margin:0 0 10px}
  .lead{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .lead:hover,.lead.sel{border-color:var(--brand);background:#F7F9FC}
  .lead .n{font-weight:700;font-size:14px}
  .lead .d{font-size:12px;color:var(--faint)}
  .st{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
      border-radius:99px;padding:2px 8px;margin-top:6px;background:var(--bg);color:var(--muted)}
  .st.proceso{background:#E8EEF8;color:var(--brand-d)}
  .st.md{background:#FBEDE3;color:var(--orange)}
  .st.pdf{background:var(--green-bg);color:var(--green)}
  .empty{color:var(--faint);font-size:13.5px}
  .field{margin-bottom:14px}
  label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
  textarea{width:100%;min-height:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
           font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink)}
  button{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
  .btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
  .files a{display:inline-block;margin:0 10px 6px 0;color:var(--brand);font-weight:600;font-size:13.5px;text-decoration:none}
  .files a:hover{text-decoration:underline}
  .qa{background:var(--bg);border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:10px 14px;
      font-size:13px;white-space:pre-wrap;margin-top:10px}
  .hint{font-size:12.5px;color:var(--faint)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Estudio de viabilidad de IA</div>
  <div><h1>Panel del consultor</h1><div class="sub">Leads de la reunión de diagnóstico: estado del research y estudio generado.</div></div>
</div>

<div class="wrap">
  <div class="card">
    <h2>Leads</h2>
    <div id="leads"><div class="empty">Cargando…</div></div>
  </div>

  <div class="card" id="detalle">
    <h2>Selecciona un lead</h2>
    <div class="empty">A la izquierda. El más reciente arriba.</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let leads = [], sel = null;

function estado(l){
  if(l.pdf) return ["pdf","Informe listo"];
  if(l.md)  return ["md","Research recibido · generando PDF"];
  return ["proceso","Investigando"];
}

async function cargar(){
  leads = await (await fetch("/api/leads")).json();
  const box = $("#leads"); box.innerHTML = "";
  if(!leads.length){ box.innerHTML = '<div class="empty">Todavía no hay leads.</div>'; return; }
  for(const l of leads){
    const st = estado(l);
    box.insertAdjacentHTML("beforeend",
      `<div class="lead ${sel===l.id?'sel':''}" data-id="${l.id}"><div class="n">${esc(l.empresa)}</div>
       <div class="d">${esc(l.fecha)} · ${esc(l.contacto)}</div><span class="st ${st[0]}">${st[1]}</span></div>`);
  }
  document.querySelectorAll(".lead").forEach(el => el.addEventListener("click", () => abrir(el.dataset.id)));
}

async function abrir(id){
  sel = id;
  const l = leads.find(x => x.id === id);
  const prompt = await (await fetch(`/api/leads/${encodeURIComponent(id)}/prompt`)).text();
  const d = $("#detalle");
  d.innerHTML = `
    <h2>${esc(l.empresa)} <span class="hint">· ${esc(l.fecha)}</span></h2>
    <div class="field"><label>1 · Prompt enviado al research</label>
      <textarea id="prompt" readonly>${esc(prompt)}</textarea></div>
    <div class="actions"><button class="btn-ghost" id="copiar">Copiar prompt</button>
      <span class="hint" style="align-self:center">Es el texto que se envió al deep research; sirve para revisarlo o reutilizarlo.</span></div>
    <div class="field"><label>2 · Estudio</label>
      <div class="files" id="files"></div>
      <div id="qa" class="qa hidden"></div></div>`;
  pintaFicheros(l);
  $("#copiar").addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(prompt); }catch(e){ $("#prompt").select(); document.execCommand("copy"); }
    $("#copiar").textContent = "Copiado"; setTimeout(() => $("#copiar").textContent = "Copiar prompt", 1500);
  });
  document.querySelectorAll(".lead").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
}

function pintaFicheros(l){
  const f = $("#files"); f.innerHTML = "";
  const url = n => `/api/leads/${encodeURIComponent(l.id)}/archivo/${n}`;
  if(l.pdf) f.insertAdjacentHTML("beforeend", `<a href="${url("informe.pdf")}" target="_blank">Informe (PDF)</a>`);
  if(l.anexo) f.insertAdjacentHTML("beforeend", `<a href="${url("anexo_fuentes.pdf")}" target="_blank">Anexo de fuentes</a>`);
  if(l.md) f.insertAdjacentHTML("beforeend", `<a href="${url("informe.md")}" target="_blank">Research (md)</a>`);
  if(l.qa) f.insertAdjacentHTML("beforeend", `<a href="${url("qa.txt")}" target="_blank">Avisos de QA (txt)</a>`);
  if(!l.pdf && !l.md) f.innerHTML = '<span class="hint">El research sigue en marcha; el estudio aparecerá aquí cuando termine.</span>';
  if(l.qa){ $("#qa").textContent = "Avisos de revisión:\n" + l.qa; $("#qa").classList.remove("hidden"); }
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
cargar();
setInterval(cargar, 30000);   // el research tarda minutos: refresco periódico del estado
</script>
</body>
</html>
